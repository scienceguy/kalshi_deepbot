name: token-corruption-guards

# Runs the corruption gates on every push and pull request, not just in a local
# clone. The pre-commit hook protects only a developer who ran
# scripts/install-pre-commit.sh; this job makes the guards unavoidable for every
# agent drum and every branch.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  guards:
    name: corruption gates
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the diff-based gates below resolve a base commit, which
          # a depth-1 clone does not have.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # gitleaks secret scanner (installed manually to avoid license requirement in action)
      - name: Install gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.18.2/gitleaks_8.18.2_linux_x64.tar.gz | tar xz -C /usr/local/bin gitleaks

      # pyflakes is what verify_undefined.py reads. requirements.txt is needed
      # because the gates import modules to parse them; the gates themselves never
      # execute a trading entry point.
      - name: Install gate dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyflakes
          if [ -f requirements.txt ]; then python -m pip install -r requirements.txt; fi

      # Each gate is a separate step so a failure names the corruption class
      # instead of a bare "job failed".

      - name: 0/6 secret scan (gitleaks)
        run: gitleaks detect --source . --config .gitleaks.toml --verbose --no-banner

      - name: 1/6 non-ASCII letters and number+name splices
        run: python scripts/verify_source.py --all

      - name: 2/5 files that do not parse
        run: python scripts/verify_compiles.py --all

      - name: 3/5 undefined names
        run: python scripts/verify_undefined.py --all

      # The two diff gates need unified diff TEXT, not the event JSON. Work out
      # the base commit for this event and let git produce the diff.
      - name: Resolve base commit
        id: base
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "ref=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_OUTPUT"
          else
            # push: the commit before this one; on the first commit use the empty tree.
            if git rev-parse --verify --quiet "${{ github.event.before }}^{commit}" >/dev/null; then
              echo "ref=${{ github.event.before }}" >> "$GITHUB_OUTPUT"
            else
              echo "ref=$(git hash-object -t tree /dev/null)" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: 4/5 operator and not drift
        run: |
          BASE="${{ steps.base.outputs.ref }}"
          echo "base=$BASE"
          git diff -U3 "$BASE" HEAD -- "*.py" > "$RUNNER_TEMP/guards.diff"
          wc -l "$RUNNER_TEMP/guards.diff"
          python scripts/verify_operators.py --diff-file "$RUNNER_TEMP/guards.diff"

      - name: 5/5 unreviewed money-path conditions
        run: |
          BASE="${{ steps.base.outputs.ref }}"
          git diff -U3 "$BASE" HEAD -- "*.py" > "$RUNNER_TEMP/review.diff"
          wc -l "$RUNNER_TEMP/review.diff"
          python scripts/verify_review_marked.py --diff-file "$RUNNER_TEMP/review.diff"

      - name: full test suite
        run: python -m pytest tests/ -q
